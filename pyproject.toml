[project]
name = "mmd-flagger"
version = "2.0"
description = ""
authors = [{ name = "Kensuke-Mitsuzawa", email = "kensuke.mit@gmail.com" }]
requires-python = "<3.13,>=3.10"
readme = "README.md"
dependencies = [
    "dvc>=3.63.0,<4",
    "torch>=2.9.0,<3",
    "pydantic>=2.12.3,<3",
    "transformers<=4.50.0",
    "accelerate>=1.10.1,<2",
    "bitsandbytes>=0.48.1,<0.49",
    "logzero>=1.7.0,<2",
    "duckdb>=1.4.1,<2",
    "mmd-tst-variable-detector",
    "nltk>=3.9.2,<4",
    "scipy>=1.9.0",
    "pytorch-ignite>=0.5.3,<0.6",
    "gputil>=1.4.0,<2",
    "datasets<4.0.0",
    "fsspec",
    "spacy>=3.7.5",
    "pip>=25.3",
    "python-dotenv>=1.2.1",
    "msgpack>=1.1.2",
    "pydantic-settings>=2.12.0",
    "sentence-transformers>=5.7.0",
    "zstandard>=0.25.0",
]

[tool.uv]

[tool.uv.sources]
mmd-tst-variable-detector = { url = "https://github.com/Kensuke-Mitsuzawa/mmd-two-sample-test-variable-selection/archive/refs/tags/1.5.zip" }

[tool.hatch.build.targets.sdist]
include = ["mmd_flagger"]

[tool.hatch.build.targets.wheel]
include = [
    "mmd_flagger",
    "mmd_flagger/resources/*.duckdb"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
test = [
    "pytest (>=8.4.2,<9.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "long_running: tests that take a long time to run (skipped by default)",
    "serial: tests that must run sequentially",
]
